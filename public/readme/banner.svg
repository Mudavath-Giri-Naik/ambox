<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="45%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4d9ff"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- decorative film-strip dots -->
  <g opacity="0.25">
    <circle cx="60" cy="40" r="4" fill="#fff"/>
    <circle cx="90" cy="40" r="4" fill="#fff"/>
    <circle cx="120" cy="40" r="4" fill="#fff"/>
    <circle cx="1160" cy="280" r="4" fill="#fff"/>
    <circle cx="1190" cy="280" r="4" fill="#fff"/>
    <circle cx="1220" cy="280" r="4" fill="#fff"/>
  </g>

  <!-- waveform accent -->
  <g transform="translate(120,230)" opacity="0.55" stroke="#fff" stroke-width="4" stroke-linecap="round">
    <line x1="0" y1="-6" x2="0" y2="6"/>
    <line x1="14" y1="-16" x2="14" y2="16"/>
    <line x1="28" y1="-26" x2="28" y2="26"/>
    <line x1="42" y1="-12" x2="42" y2="12"/>
    <line x1="56" y1="-30" x2="56" y2="30"/>
    <line x1="70" y1="-18" x2="70" y2="18"/>
    <line x1="84" y1="-8" x2="84" y2="8"/>
  </g>

  <!-- play button emblem -->
  <g transform="translate(985,70)">
    <circle cx="60" cy="60" r="60" fill="url(#playGrad)" opacity="0.95"/>
    <path d="M48 40 L86 60 L48 80 Z" fill="#6d28d9"/>
  </g>

  <!-- wordmark -->
  <text x="120" y="150" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="700" fill="#ffffff">Ambox</text>
  <text x="124" y="192" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="400" fill="#f3e8ff">AI-Powered Collaboration for Video Creators &amp; Editors</text>
</svg>
